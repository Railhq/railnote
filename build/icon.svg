<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS tile: 824px rounded square on the 1024 grid, with the Dock's soft shadow -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a33"/><stop offset="1" stop-color="#132822"/>
    </linearGradient>
    <clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <g clip-path="url(#c)"><g transform="translate(100 100) scale(1.609375)">
  <!-- the rail: a line with the current stop lit, as on the welcome screen -->
  <rect x="150" y="96" width="22" height="320" rx="11" fill="#2f5249"/>
  <rect x="150" y="96" width="22" height="150" rx="11" fill="#f0a202"/>
  <circle cx="161" cy="246" r="44" fill="#f0a202" stroke="#17302a" stroke-width="16"/>
  <circle cx="161" cy="140" r="22" fill="#17302a" stroke="#f0a202" stroke-width="10"/>
  <circle cx="161" cy="372" r="22" fill="#17302a" stroke="#2f5249" stroke-width="10"/>
  <rect x="236" y="226" width="150" height="16" rx="8" fill="#dce6e1"/>
  <rect x="236" y="258" width="110" height="16" rx="8" fill="#8fa39b"/>
  <rect x="236" y="130" width="96" height="12" rx="6" fill="#8fa39b" opacity="0.6"/>
  <rect x="236" y="366" width="120" height="12" rx="6" fill="#8fa39b" opacity="0.6"/>
</g></g>
</svg>
